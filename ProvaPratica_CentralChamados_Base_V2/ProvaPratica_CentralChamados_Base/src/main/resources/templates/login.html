<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Central de Chamados | Login</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="card narrow">
    <h1>🔐 Central de Chamados</h1>
    <p>Acesse para acompanhar solicitações de suporte.</p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>
    <form th:action="@{/login}" method="post">
        <label>Usuário <input name="login" required>
        </label>
        <label>Senha <input name="senha" type="password" required>
        </label>
        <button>Entrar</button>
    </form>
</main>
</body>
</html>
